name: "Main"
on:
  pull_request:
  push:
jobs:
  test-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Test run
        run: |
          nix run . -- -z -c 32768 -x 32 -y 18
          nix run . -- -z -c 8192 -x 64 -y 36
          nix run . -- -z -c 2048 -x 128 -y 72
